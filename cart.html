<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="width">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">
<meta name="format-detection" content="telephone=no">
<!-- AZUBA-VIEWPORT-FIX: forces the real device width on OEM/old WebView
     browsers (Transsion/Tecno/Infinix stock browser, old MIUI browser,
     UC/QQ/360 browser, older Android System WebView) that ignore
     width=device-width and instead lay the page out on a wider phantom
     canvas, making everything except fixed elements render too small. -->
<script>
(function () {
  // PERF NOTE (forced reflow fix): the previous version of this script
  // interleaved reads (screen.width / clientWidth) and writes (meta
  // attribute, html.style.zoom, scrollTo) — each read after a write
  // forced the browser to synchronously recompute layout before it could
  // answer, and nudge() even dispatched a synthetic 'resize' event
  // *synchronously*, which re-entered fix() (via the resize listener)
  // mid-write. That's the classic read→write→read→write layout-thrashing
  // pattern. Fixed by: (1) reading both widths once per pass instead of
  // re-reading them in every helper, (2) batching all writes (meta
  // rewrite, zoom toggle, scroll nudge) into requestAnimationFrame
  // callbacks so they land together in one layout pass instead of being
  // interleaved with reads, (3) a reentrancy guard so the deferred
  // resize dispatch can't recursively kick off another read/write cycle
  // while one is still in flight, and (4) coalescing every trigger
  // through a single rAF-scheduled call so bursts of near-simultaneous
  // events run the check once, not once per event.
  //
  // CORRECTNESS FIX (false-positive zoom fix — spontaneous zoom on
  // devices that didn't actually have the OEM bug): the old heuristic
  // fired on ANY mismatch over a flat 4px between screen.width and
  // document.documentElement.clientWidth, and re-checked on every
  // 'resize'/'visibilitychange'/visualViewport 'resize' event. That's
  // far too sensitive — a 4px gap happens constantly from ordinary,
  // non-buggy causes: Android "Display size" scaling, DPI/subpixel
  // rounding, the status/nav bar showing or hiding, the on-screen
  // keyboard opening (which fires a visualViewport resize), or the
  // user's own deliberate pinch-zoom. Every one of those was getting
  // "corrected" by forcing a zoom toggle, which is the spontaneous-zoom
  // bug itself. Fixed by:
  //   1. A much wider, size-relative threshold — real OEM phantom-canvas
  //      bugs show up as a huge mismatch (e.g. a 980px desktop-mode
  //      layout on a 360-412px real screen), not a few px. Requiring the
  //      gap to be both >24px AND >8% of the real width keeps that catch
  //      while ignoring ordinary rounding/DPI noise.
  //   2. Skips entirely if the user has actually pinch-zoomed
  //      (visualViewport.scale away from 1) — that's intentional user
  //      input, not a layout bug, and must never be fought/reset.
  //   3. Only re-runs the check on events that correspond to a genuine
  //      new layout being computed (first paint, page restored from
  //      bfcache, orientation change) — no longer re-triggers on plain
  //      'resize' or visualViewport 'resize', which are exactly the
  //      events fired by the keyboard opening or the browser's toolbar
  //      auto-hiding on scroll, not by the OEM bug.
  function realWidth() {
    return (window.visualViewport && window.visualViewport.width) || window.screen.width || window.innerWidth;
  }
  function layoutWidth() {
    return document.documentElement.clientWidth || window.innerWidth;
  }
  function userHasZoomed() {
    // A visualViewport.scale meaningfully away from 1 means the user is
    // mid pinch-zoom (or has zoomed in) — respect that, don't "fix" it.
    return !!(window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.05);
  }
  function rewriteMeta(real) {
    var meta = document.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = document.createElement('meta');
      meta.setAttribute('name', 'viewport');
      document.head.insertBefore(meta, document.head.firstChild);
    }
    meta.setAttribute(
      'content',
      'width=' + real + ', initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
    );
  }
  // Rewriting the <meta viewport> content alone is often not enough on
  // OEM/old WebView browsers (Tecno/Infinix/Transsion stock browser, old
  // MIUI browser, UC/QQ/360 browser): they commit a wrong layout
  // viewport at parse time and only ever recompute it in response to an
  // actual pinch/zoom gesture — a JS content change doesn't trigger that
  // recompute. A tiny CSS zoom toggle forces the same kind of recompute
  // these engines do on a real pinch, without needing real touch input.
  // All writes below are grouped into rAF callbacks (one layout pass),
  // instead of the previous write→read(scrollTo)→write→(sync dispatch)
  // sequence.
  var fixing = false;
  function nudge(real, onDone) {
    var html = document.documentElement;
    rewriteMeta(real);
    html.style.zoom = '99.9%';
    requestAnimationFrame(function () {
      html.style.zoom = '100%';
      try { window.scrollTo(0, 1); window.scrollTo(0, 0); } catch (e) {}
      requestAnimationFrame(function () {
        html.style.zoom = '';
        // Deferred (not synchronous) so any listener it wakes up —
        // including this script's own, below — runs as a fresh task
        // instead of re-entering mid-write.
        try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        onDone();
      });
    });
  }
  var attempts = 0;
  function runCheck() {
    if (fixing) return; // reentrancy guard
    if (userHasZoomed()) return; // never fight the user's own pinch-zoom
    // Single read pass: grab both widths once and reuse them, instead of
    // each helper re-reading clientWidth/screen.width on its own.
    var real = Math.round(realWidth());
    var layout = Math.round(layoutWidth());
    if (!real || !layout) return;
    var gap = Math.abs(layout - real);
    // Wide, size-relative threshold — see CORRECTNESS FIX note above.
    // Ordinary DPI/rounding/status-bar noise stays well under this;
    // a real OEM phantom-canvas bug (e.g. 980 vs 360) blows past it.
    var threshold = Math.max(24, real * 0.08);
    if (gap <= threshold) return;
    fixing = true;
    nudge(real, function () {
      fixing = false;
    });
    attempts++;
    // Retry with backoff — on a very slow connection the page keeps
    // reflowing as images/content arrive, which can re-trigger the bug
    // after the first fix looked successful.
    if (attempts < 8) {
      setTimeout(scheduleCheck, attempts * 250);
    }
  }
  // Coalesces bursts of near-simultaneous triggers into a single check
  // per animation frame rather than one per event.
  var rafId = null;
  function scheduleCheck() {
    if (rafId) return;
    rafId = requestAnimationFrame(function () {
      rafId = null;
      runCheck();
    });
  }
  scheduleCheck();
  document.addEventListener('DOMContentLoaded', scheduleCheck);
  window.addEventListener('load', scheduleCheck);
  window.addEventListener('pageshow', scheduleCheck);
  // NOTE: intentionally NOT listening for plain 'resize', visualViewport
  // 'resize', or 'visibilitychange' anymore — those fire constantly for
  // legitimate, non-buggy reasons (keyboard open/close, browser toolbar
  // auto-hide on scroll, tab switch) and were the main source of the
  // spontaneous re-zoom reported on real devices. Orientation change is
  // kept, since a rotation is a genuine new layout that's worth
  // rechecking, same as the initial-load triggers above.
  window.addEventListener('orientationchange', function () { setTimeout(scheduleCheck, 200); });
})();
</script>

<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F3A5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AzubaTrends" id="apple-app-title-meta">
<title>Your Cart - AzubaTrends</title>
<link rel="stylesheet" href="css/main.min.css?v=20260808">
<link rel="stylesheet" href="css/components.min.css?v=20260808">
<style>
  .cart-page-grid { display: grid; grid-template-columns: 1fr 350px; gap: 30px; margin-top: 20px; align-items: start; }
  .cart-item { display: flex; gap: 20px; padding: 20px; background: white; border: 1px solid var(--color-border); border-radius: 8px; margin-bottom: 15px; }
  .cart-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .cart-item-details { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .cart-item-details h3 { overflow-wrap: break-word; }
  .cart-item-total { flex-shrink: 0; font-weight: bold; font-size: 1.2rem; text-align: right; }
  .qty-controls { display: flex; align-items: center; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
  .qty-btn { background: #eee; border: none; padding: 5px 12px; font-size: 1.2rem; cursor: pointer; border-radius: 4px; }
  .remove-btn { color: red; background: none; border: none; cursor: pointer; font-size: 0.9rem; text-decoration: underline; margin-top: 10px; }
  .summary-card { background: white; padding: 25px; border: 1px solid var(--color-border); border-radius: 8px; position: sticky; top: 90px; }
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.1rem; }
  .coupon-section { display: flex; gap: 10px; margin: 20px 0; border-top: 1px dashed #ccc; border-bottom: 1px dashed #ccc; padding: 20px 0; }
  @media (max-width: 768px) { .cart-page-grid { grid-template-columns: 1fr; } .summary-card { position: static; top: auto; } }
  @media (max-width: 480px) {
    .cart-item { flex-wrap: wrap; }
    .cart-item-details { flex-basis: calc(100% - 120px); }
    .cart-item-total { flex-basis: 100%; text-align: left; margin-top: 8px; }
  }
</style>
</head>
<body>

<div id="header-mount"></div>

<main class="container" style="padding: 40px 20px; min-height: 60vh;">
  <div id="checkout-progress-mount"></div>
  <h1>Your Shopping Cart</h1>
  
  <div id="empty-cart-msg" style="display: none; text-align: center; margin-top: 50px;">
    <h2>Your cart is empty!</h2>
    <p>Looks like you haven't added anything yet.</p>
    <a href="/" class="btn btn-primary" style="margin-top: 20px;">Continue Shopping</a>
  </div>

  <div id="cart-availability-banner" class="availability-status availability-status--unavailable" hidden style="margin-top: 16px;"></div>

  <div class="cart-page-grid" id="cart-content" style="display: none;">
    <!-- Left Side: Items -->
    <div id="cart-items-container"></div>

    <!-- Right Side: Summary & Coupon -->
    <div class="summary-card">
      <h3>Order Summary</h3>
      <div class="summary-row" style="margin-top: 20px;">
        <span>Subtotal</span>
        <span id="cart-subtotal">₹0</span>
      </div>
      
      <div class="coupon-section">
        <input type="text" id="coupon-input" placeholder="Enter Coupon Code" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        <button class="btn btn-outline" id="apply-coupon-btn">Apply</button>
      </div>
      <p id="coupon-msg" style="font-size: 0.85rem; margin-top: -10px; margin-bottom: 15px;"></p>

      <div class="summary-row" id="discount-row" style="display: none; color: green;">
        <span>Discount</span>
        <span id="cart-discount">-₹0</span>
      </div>

      <div class="summary-row" style="font-weight: bold; font-size: 1.3rem; border-top: 2px solid #eee; padding-top: 15px;">
        <span>Total</span>
        <span id="cart-final-total">₹0</span>
      </div>

      <button id="checkout-btn" class="btn btn-primary btn-block" style="margin-top: 20px; font-size: 1.1rem; padding: 15px;">Proceed to Checkout</button>
    </div>
  </div>
</main>

<div id="footer-mount"></div>

<script defer src="js/site-config.min.js?v=20260808"></script>
<script defer src="js/tracking.min.js?v=20260808"></script>
<script defer src="js/security.min.js?v=20260808"></script>
<script defer src="js/layout.min.js?v=20260808"></script>
<script defer src="js/loading-overlay.min.js?v=20260808"></script>
<script defer src="js/a2hs.min.js?v=20260808"></script>
<script defer src="js/cart.min.js?v=20260808"></script>
<script defer src="js/coupon.min.js?v=20260808"></script>
<script defer src="js/product-loader.min.js?v=20260808"></script>
<script defer src="js/availability.min.js?v=20260808"></script>
<script defer src="js/checkout-progress.min.js?v=20260808"></script>
<script>
  window.addEventListener("layout:ready", () => ProductLoader.initHeader());

  document.addEventListener("DOMContentLoaded", () => {
    // Moved inside DOMContentLoaded (was an immediate top-level call) so
    // checkout-progress.js can safely load with `defer` — a deferred
    // script isn't guaranteed to have run yet at the point this inline
    // script block executes, only by the time DOMContentLoaded fires.
    CheckoutProgress.render(document.getElementById("checkout-progress-mount"), 0);

    let appliedDiscount = 0;
    
    function renderCartPage() {
      const items = window.Cart.getItems();
      const container = document.getElementById("cart-items-container");
      const emptyMsg = document.getElementById("empty-cart-msg");
      const cartContent = document.getElementById("cart-content");

      if (items.length === 0) {
        emptyMsg.style.display = "block";
        cartContent.style.display = "none";
        sessionStorage.removeItem("applied_coupon");
        return;
      }

      emptyMsg.style.display = "none";
      cartContent.style.display = "grid";
      container.innerHTML = "";

      items.forEach(item => {
        const safeTitle = Security.escapeHTML(item.title);
        const safeImage = Security.escapeHTML(item.image || 'images/logo-placeholder.svg');
        const variantLine = (item.size || item.color)
          ? `<p style="margin:2px 0; font-size:0.85rem; color:var(--color-ink-soft);">${Security.escapeHTML([item.size, item.color].filter(Boolean).join(" / "))}</p>`
          : '';
        container.innerHTML += `
          <div class="cart-item" data-product-id="${Security.escapeHTML(item.productId)}">
            <img src="${safeImage}" alt="Product">
            <div class="cart-item-details">
              <div>
                <h3 style="margin: 0; font-size: 1.2rem;">${safeTitle}</h3>
                ${variantLine}
                <p style="margin: 5px 0; font-weight: bold; color: var(--color-primary);">₹${item.price}</p>
                <p class="cart-item-unavailable-tag" hidden style="color:var(--color-danger); font-size:0.82rem; font-weight:600;"></p>
              </div>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty('${item.productId}', -1)">-</button>
                <span style="font-weight: bold; font-size: 1.1rem; width: 20px; text-align: center;">${item.quantity}</span>
                <button class="qty-btn" onclick="updateQty('${item.productId}', 1)">+</button>
                <button class="remove-btn" onclick="removeItem('${item.productId}')">Remove</button>
              </div>
            </div>
            <div class="cart-item-total">₹${item.price * item.quantity}</div>
          </div>
        `;
      });

      calculateTotals();
      validateCartAvailability();
    }

    // Re-checks every cart item against the pincode the shopper last
    // checked on a product page (see product.html's delivery checker) —
    // if none is saved yet, this is skipped entirely and checkout stays
    // open (the hard, final gate is checkout.js + the server, not here).
    // Uses ProductLoader.getProductById, which reads from the cheap
    // /api/products endpoint (not a direct Firestore read), so this never
    // adds to the Firestore free-tier quota.
    async function validateCartAvailability() {
      const banner = document.getElementById("cart-availability-banner");
      const checkoutBtn = document.getElementById("checkout-btn");
      let pin;
      try { pin = localStorage.getItem("azuba_last_pincode"); } catch (err) { pin = null; }
      if (!pin) { banner.hidden = true; checkoutBtn.disabled = false; return; }

      const items = window.Cart.getItems();
      const unavailableTitles = [];
      await Promise.all(items.map(async (item) => {
        const rowEl = document.querySelector(`.cart-item[data-product-id="${CSS.escape(item.productId)}"]`);
        const tagEl = rowEl ? rowEl.querySelector(".cart-item-unavailable-tag") : null;
        try {
          const product = await ProductLoader.getProductById(item.productId);
          const available = product ? await Availability.isProductAvailableAt(product, pin) : true;
          if (!available) {
            unavailableTitles.push(item.title);
            if (tagEl) { tagEl.hidden = false; tagEl.textContent = `🚫 Not available at pincode ${pin}`; }
          } else if (tagEl) {
            tagEl.hidden = true;
          }
        } catch (err) {
          console.error("Availability re-check failed for cart item:", item.productId, err);
        }
      }));

      if (unavailableTitles.length > 0) {
        banner.hidden = false;
        banner.innerHTML = `<span>🚫</span><span>${unavailableTitles.length} item${unavailableTitles.length > 1 ? "s" : ""} in your cart ${unavailableTitles.length > 1 ? "aren't" : "isn't"} available at pincode <strong>${Security.escapeHTML(pin)}</strong>. Remove ${unavailableTitles.length > 1 ? "them" : "it"} or check a different pincode on the product page before checkout.</span>`;
        checkoutBtn.disabled = true;
      } else {
        banner.hidden = true;
        checkoutBtn.disabled = false;
      }
    }

    window.updateQty = (id, change) => {
      const items = window.Cart.getItems();
      const item = items.find(i => i.productId === id);
      if(item) {
        const newQty = item.quantity + change;
        window.Cart.updateQuantity(id, newQty);
        renderCartPage();
      }
    };

    window.removeItem = (id) => {
      window.Cart.removeItem(id);
      renderCartPage();
    };

    function calculateTotals() {
      const subtotal = window.Cart.getTotal();
      document.getElementById("cart-subtotal").textContent = "₹" + subtotal;

      // Re-check any applied coupon against the CURRENT subtotal every time
      // totals are recalculated (qty +/-, item removed, or page just
      // loaded). Without this, a coupon that was valid at ₹600 stays
      // "applied" in the UI even after the shopper drops the cart to ₹300,
      // below its minOrderValue — this is what fixes that.
      const msg = document.getElementById("coupon-msg");
      const saved = sessionStorage.getItem("applied_coupon");
      if (saved) {
        let parsed;
        try { parsed = JSON.parse(saved); } catch (err) { parsed = null; }
        if (parsed && parsed.code) {
          window.Coupon.validate(parsed.code, subtotal, window.Cart.getItems()).then((result) => {
            if (result.valid) {
              appliedDiscount = result.discount;
              msg.textContent = result.message;
              msg.style.color = "green";
              document.getElementById("discount-row").style.display = "flex";
              document.getElementById("cart-discount").textContent = "-₹" + appliedDiscount;
              sessionStorage.setItem("applied_coupon", JSON.stringify({ code: result.coupon.code, discount: appliedDiscount }));
            } else {
              appliedDiscount = 0;
              msg.textContent = "Coupon removed — " + result.message;
              msg.style.color = "red";
              document.getElementById("discount-row").style.display = "none";
              sessionStorage.removeItem("applied_coupon");
            }
            const finalTotal = subtotal - appliedDiscount;
            document.getElementById("cart-final-total").textContent = "₹" + (finalTotal > 0 ? finalTotal : 0);
          });
          return; // final-total text gets updated inside the .then() above
        }
      }

      const finalTotal = subtotal - appliedDiscount;
      document.getElementById("cart-final-total").textContent = "₹" + (finalTotal > 0 ? finalTotal : 0);
    }

    // Coupon Logic
    document.getElementById("apply-coupon-btn").addEventListener("click", async () => {
      const code = document.getElementById("coupon-input").value;
      const subtotal = window.Cart.getTotal();
      const msg = document.getElementById("coupon-msg");

      if(!code) return;
      const result = await window.Coupon.validate(code, subtotal, window.Cart.getItems());
      
      if(result.valid) {
        appliedDiscount = result.discount;
        msg.textContent = result.message;
        msg.style.color = "green";
        document.getElementById("discount-row").style.display = "flex";
        document.getElementById("cart-discount").textContent = "-₹" + appliedDiscount;
        // Save coupon for checkout page
        sessionStorage.setItem("applied_coupon", JSON.stringify({ code: result.coupon.code, discount: appliedDiscount }));
      } else {
        appliedDiscount = 0;
        msg.textContent = result.message;
        msg.style.color = "red";
        document.getElementById("discount-row").style.display = "none";
        sessionStorage.removeItem("applied_coupon");
      }
      calculateTotals();
    });

    // Checkout Button
    document.getElementById("checkout-btn").addEventListener("click", () => {
      window.location.href = "/checkout";
    });

    renderCartPage();
  });
</script>
</body>
</html>
