<header class="site-header">
  <div class="site-header__bar">
    <a href="/" class="site-logo" aria-label="AzubaTrends home">
      <img id="site-logo-img" src="" alt="" style="display:none;">
      <span id="site-logo-text" class="site-logo__text" data-site-name>AzubaTrends</span>
    </a>

    <div class="search-wrap">
      <form class="search-form" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="site-search-input" name="q" placeholder="Search handmade & hand-loomed goods..." aria-label="Search products" autocomplete="off">
      </form>
      <div class="search-suggestions" role="listbox" hidden></div>
    </div>

    <nav class="site-nav" aria-label="Primary">
      <a href="/" data-page="index.html">Home</a>
      <a href="/category" data-page="category.html">Categories</a>
      <a href="/brand" data-page="brand.html">Brands</a>
      <a href="/about" data-page="about.html">About</a>
      <a href="/blog" data-page="blog.html">Blog</a>

      <div class="site-nav__dropdown" id="policies-dropdown">
        <button type="button" class="site-nav__dropdown-trigger" id="policies-dropdown-trigger" aria-haspopup="true" aria-expanded="false">
          Policies
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="site-nav__dropdown-caret"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="site-nav__dropdown-panel" role="menu">
          <a href="/terms" role="menuitem">Terms &amp; Conditions</a>
          <a href="/terms#delivery-area" role="menuitem">Delivery Area</a>
          <a href="/terms#returns" role="menuitem">Returns &amp; Refunds</a>
          <a href="/terms#reviews-policy" role="menuitem">Reviews Policy</a>
        </div>
      </div>
    </nav>

    <div class="header-icon-group">
      <!-- Account — no account system yet, so this opens the same
           "in development" notice as the mobile Profile tab (see layout.js)
           instead of a dead link. -->
      <button type="button" class="header-icon-btn" id="header-account-btn" aria-label="Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>

      <!-- Desktop-only wishlist entry point (mobile has its own tab in the
           bottom nav) — links straight to the wishlist page, no "coming
           soon" modal anymore now that it's backed by localStorage. -->
      <a href="/wishlist" class="header-icon-btn header-icon-btn--wishlist" aria-label="View wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="header-icon-btn__badge" data-wishlist-count hidden>0</span>
      </a>

      <!-- FIXED: Link to cart.html -->
      <a href="/cart" class="header-cart" aria-label="View cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="header-cart__badge" data-cart-count id="cart-count-badge">0</span>
      </a>
    </div>
  </div>
</header>

<!-- Category icon-chip row — Home/Categories pages only (§2.1). Hidden by
     default; category-chips.js reveals + fills it in on pages that opt in
     via <body data-show-chips>. Left empty here so pages that don't opt in
     never show an empty bar. Moved OUTSIDE <header> on purpose: a
     position:sticky element can only stay pinned while its own parent box
     is still in view — when the chip row lived inside <header>, the
     header's box was only ~header+chips tall, so the sticky bar unstuck
     itself right after that short height scrolled by (the bug in the
     screenshot). As a sibling of <header> instead (both direct children of
     #header-mount, which is display:contents — see main.css), the sticky
     bar's effective containing block becomes <body>, which is the full
     page height, so it stays pinned for the entire scroll. -->
<div class="category-chip-row" id="category-chip-row" hidden>
  <div class="category-chip-row__inner" id="category-chip-list"></div>
</div>
