<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="width">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">
<meta name="format-detection" content="telephone=no">
<!-- AZUBA-VIEWPORT-FIX: forces the real device width on OEM/old WebView
     browsers (Transsion/Tecno/Infinix stock browser, old MIUI browser,
     UC/QQ/360 browser, older Android System WebView) that ignore
     width=device-width and instead lay the page out on a wider phantom
     canvas, making everything except fixed elements render too small. -->
<script>
(function () {
  // PERF NOTE (forced reflow fix): the previous version of this script
  // interleaved reads (screen.width / clientWidth) and writes (meta
  // attribute, html.style.zoom, scrollTo) — each read after a write
  // forced the browser to synchronously recompute layout before it could
  // answer, and nudge() even dispatched a synthetic 'resize' event
  // *synchronously*, which re-entered fix() (via the resize listener)
  // mid-write. That's the classic read→write→read→write layout-thrashing
  // pattern. Fixed by: (1) reading both widths once per pass instead of
  // re-reading them in every helper, (2) batching all writes (meta
  // rewrite, zoom toggle, scroll nudge) into requestAnimationFrame
  // callbacks so they land together in one layout pass instead of being
  // interleaved with reads, (3) a reentrancy guard so the deferred
  // resize dispatch can't recursively kick off another read/write cycle
  // while one is still in flight, and (4) coalescing every trigger
  // through a single rAF-scheduled call so bursts of near-simultaneous
  // events run the check once, not once per event.
  //
  // CORRECTNESS FIX (false-positive zoom fix — spontaneous zoom on
  // devices that didn't actually have the OEM bug): the old heuristic
  // fired on ANY mismatch over a flat 4px between screen.width and
  // document.documentElement.clientWidth, and re-checked on every
  // 'resize'/'visibilitychange'/visualViewport 'resize' event. That's
  // far too sensitive — a 4px gap happens constantly from ordinary,
  // non-buggy causes: Android "Display size" scaling, DPI/subpixel
  // rounding, the status/nav bar showing or hiding, the on-screen
  // keyboard opening (which fires a visualViewport resize), or the
  // user's own deliberate pinch-zoom. Every one of those was getting
  // "corrected" by forcing a zoom toggle, which is the spontaneous-zoom
  // bug itself. Fixed by:
  //   1. A much wider, size-relative threshold — real OEM phantom-canvas
  //      bugs show up as a huge mismatch (e.g. a 980px desktop-mode
  //      layout on a 360-412px real screen), not a few px. Requiring the
  //      gap to be both >24px AND >8% of the real width keeps that catch
  //      while ignoring ordinary rounding/DPI noise.
  //   2. Skips entirely if the user has actually pinch-zoomed
  //      (visualViewport.scale away from 1) — that's intentional user
  //      input, not a layout bug, and must never be fought/reset.
  //   3. Only re-runs the check on events that correspond to a genuine
  //      new layout being computed (first paint, page restored from
  //      bfcache, orientation change) — no longer re-triggers on plain
  //      'resize' or visualViewport 'resize', which are exactly the
  //      events fired by the keyboard opening or the browser's toolbar
  //      auto-hiding on scroll, not by the OEM bug.
  function realWidth() {
    return (window.visualViewport && window.visualViewport.width) || window.screen.width || window.innerWidth;
  }
  function layoutWidth() {
    return document.documentElement.clientWidth || window.innerWidth;
  }
  function userHasZoomed() {
    // A visualViewport.scale meaningfully away from 1 means the user is
    // mid pinch-zoom (or has zoomed in) — respect that, don't "fix" it.
    return !!(window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.05);
  }
  function rewriteMeta(real) {
    var meta = document.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = document.createElement('meta');
      meta.setAttribute('name', 'viewport');
      document.head.insertBefore(meta, document.head.firstChild);
    }
    meta.setAttribute(
      'content',
      'width=' + real + ', initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
    );
  }
  // Rewriting the <meta viewport> content alone is often not enough on
  // OEM/old WebView browsers (Tecno/Infinix/Transsion stock browser, old
  // MIUI browser, UC/QQ/360 browser): they commit a wrong layout
  // viewport at parse time and only ever recompute it in response to an
  // actual pinch/zoom gesture — a JS content change doesn't trigger that
  // recompute. A tiny CSS zoom toggle forces the same kind of recompute
  // these engines do on a real pinch, without needing real touch input.
  // All writes below are grouped into rAF callbacks (one layout pass),
  // instead of the previous write→read(scrollTo)→write→(sync dispatch)
  // sequence.
  var fixing = false;
  function nudge(real, onDone) {
    var html = document.documentElement;
    rewriteMeta(real);
    html.style.zoom = '99.9%';
    requestAnimationFrame(function () {
      html.style.zoom = '100%';
      try { window.scrollTo(0, 1); window.scrollTo(0, 0); } catch (e) {}
      requestAnimationFrame(function () {
        html.style.zoom = '';
        // Deferred (not synchronous) so any listener it wakes up —
        // including this script's own, below — runs as a fresh task
        // instead of re-entering mid-write.
        try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        onDone();
      });
    });
  }
  var attempts = 0;
  function runCheck() {
    if (fixing) return; // reentrancy guard
    if (userHasZoomed()) return; // never fight the user's own pinch-zoom
    // Single read pass: grab both widths once and reuse them, instead of
    // each helper re-reading clientWidth/screen.width on its own.
    var real = Math.round(realWidth());
    var layout = Math.round(layoutWidth());
    if (!real || !layout) return;
    var gap = Math.abs(layout - real);
    // Wide, size-relative threshold — see CORRECTNESS FIX note above.
    // Ordinary DPI/rounding/status-bar noise stays well under this;
    // a real OEM phantom-canvas bug (e.g. 980 vs 360) blows past it.
    var threshold = Math.max(24, real * 0.08);
    if (gap <= threshold) return;
    fixing = true;
    nudge(real, function () {
      fixing = false;
    });
    attempts++;
    // Retry with backoff — on a very slow connection the page keeps
    // reflowing as images/content arrive, which can re-trigger the bug
    // after the first fix looked successful.
    if (attempts < 8) {
      setTimeout(scheduleCheck, attempts * 250);
    }
  }
  // Coalesces bursts of near-simultaneous triggers into a single check
  // per animation frame rather than one per event.
  var rafId = null;
  function scheduleCheck() {
    if (rafId) return;
    rafId = requestAnimationFrame(function () {
      rafId = null;
      runCheck();
    });
  }
  scheduleCheck();
  document.addEventListener('DOMContentLoaded', scheduleCheck);
  window.addEventListener('load', scheduleCheck);
  window.addEventListener('pageshow', scheduleCheck);
  // NOTE: intentionally NOT listening for plain 'resize', visualViewport
  // 'resize', or 'visibilitychange' anymore — those fire constantly for
  // legitimate, non-buggy reasons (keyboard open/close, browser toolbar
  // auto-hide on scroll, tab switch) and were the main source of the
  // spontaneous re-zoom reported on real devices. Orientation change is
  // kept, since a rotation is a genuine new layout that's worth
  // rechecking, same as the initial-load triggers above.
  window.addEventListener('orientationchange', function () { setTimeout(scheduleCheck, 200); });
})();
</script>

</head>
<body data-show-chips>

<div id="header-mount"></div>

<main>
  <div class="container">
    <section class="page-header">
      <nav class="breadcrumb" id="category-breadcrumb" aria-label="Breadcrumb">
        <span class="skeleton skeleton--line" style="width:140px; display:inline-block; vertical-align:middle;"></span>
      </nav>
      <h1 id="category-title">
        <span class="skeleton skeleton--line" style="width:220px; height:1.4em; display:inline-block; vertical-align:middle;"></span>
      </h1>
      <p id="category-subtitle">
        <span class="skeleton skeleton--line" style="width:180px; display:inline-block; vertical-align:middle;"></span>
      </p>
    </section>

    <div class="category-tiles" id="category-child-tiles" hidden></div>

    <div id="filter-bar-mount"></div>

    <div class="product-grid" id="product-grid" aria-live="polite"></div>
  </div>
</main>

<div id="footer-mount"></div>

<script defer src="/js/site-config.min.js?v=20260808"></script>
<script defer src="/js/tracking.min.js?v=20260808"></script>
<script defer src="/js/security.min.js?v=20260808"></script>
<script defer src="/js/layout.min.js?v=20260808"></script>
<script defer src="/js/loading-overlay.min.js?v=20260808"></script>
<script defer src="/js/a2hs.min.js?v=20260808"></script>
    <script defer src="/js/cart.min.js?v=20260808"></script>
    <script defer src="/js/cart-button-ui.min.js?v=20260808"></script>
<script defer src="/js/wishlist.min.js?v=20260808"></script>
<script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
<script defer src="/js/product-loader.min.js?v=20260808"></script>
<script defer src="/js/category-loader.min.js?v=20260808"></script>
<script defer src="/js/category-chips.min.js?v=20260808"></script>
<script defer src="/js/product-listing.min.js?v=20260808"></script>
<script defer src="/js/search.min.js?v=20260808"></script>
<script>
  window.addEventListener("layout:ready", () => ProductLoader.initHeader());

  // Injects/updates the BreadcrumbList JSON-LD block for the current
  // breadcrumb chain (Home + every ancestor + the current category).
  function setBreadcrumbJsonLd(items) {
    let scriptEl = document.getElementById("breadcrumb-jsonld");
    if (!scriptEl) {
      scriptEl = document.createElement("script");
      scriptEl.type = "application/ld+json";
      scriptEl.id = "breadcrumb-jsonld";
      document.head.appendChild(scriptEl);
    }
    scriptEl.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      itemListElement: items.map((item, i) => ({
        "@type": "ListItem",
        position: i + 1,
        name: item.name,
        item: item.url
      }))
    });
  }

  function renderBreadcrumbNav(chainLinks) {
    const nav = document.getElementById("category-breadcrumb");
    nav.innerHTML = "";
    chainLinks.forEach((item, i) => {
      if (i > 0) nav.appendChild(document.createTextNode(" / "));
      if (item.url && i < chainLinks.length - 1) {
        const a = document.createElement("a");
        a.href = item.url;
        a.textContent = item.name;
        nav.appendChild(a);
      } else {
        const span = document.createElement("span");
        span.textContent = item.name;
        nav.appendChild(span);
      }
    });
  }

  function renderChildTiles(node) {
    const wrap = document.getElementById("category-child-tiles");
    wrap.innerHTML = "";
    if (!node || node.children.length === 0) { wrap.hidden = true; return; }
    wrap.hidden = false;
    node.children
      .slice()
      .sort((a, b) => (a.name || "").localeCompare(b.name || ""))
      .forEach((child) => {
        const a = document.createElement("a");
        a.className = "category-tile";
        a.href = `/category/${child.fullPath}`;
        a.innerHTML = `
          <img src="${child.image ? window.Security.escapeHTML(child.image) : "images/logo-placeholder.svg"}" alt="" loading="lazy">
          <span>${window.Security.escapeHTML(child.name || "")}</span>
        `;
        wrap.appendChild(a);
      });
  }

  document.addEventListener("DOMContentLoaded", async () => {

    const grid = document.getElementById("product-grid");
    ProductLoader.renderSkeletonGrid(grid, 8);

    const [products, categories] = await Promise.all([
      ProductLoader.loadAllProducts(),
      CategoryLoader.loadAllCategories()
    ]);
    const tree = CategoryLoader.buildTree(categories);
    const titleEl = document.getElementById("category-title");
    const subtitleEl = document.getElementById("category-subtitle");

    // Clean URL is /category/some/nested/path (see _redirects' /category/*
    // rewrite -> this file), same technique product.html and blog-post.html
    // use. Every segment after "category" joins back into the fullPath the
    // nested-category tree above uses to resolve a node.
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const fullPathFromUrl = pathParts[0] === "category" ? pathParts.slice(1).join("/") : "";
    const params = new URLSearchParams(window.location.search);
    const legacyCategoryName = params.get("category") || "";

    const node = fullPathFromUrl ? CategoryLoader.findByFullPath(tree, decodeURIComponent(fullPathFromUrl)) : null;

    let visibleProducts;
    let activeLabel;
    let breadcrumbChain;

    if (node) {
      // Tree mode: this category + every descendant's products, plus any
      // legacy product that only has the flat `category` name matching
      // this exact node (no categoryId yet — pre-migration data).
      const idSet = new Set([node.id, ...CategoryLoader.getDescendantIds(node)]);
      visibleProducts = products.filter((p) => (p.categoryId && idSet.has(p.categoryId)) || (!p.categoryId && p.category === node.name));
      activeLabel = node.name;
      breadcrumbChain = [{ name: "Home", url: "/" }, ...CategoryLoader.breadcrumbChain(tree, node).map((n) => ({ name: n.name, url: `/category/${n.fullPath}` }))];
    } else if (legacyCategoryName && legacyCategoryName !== "All") {
      // Backward-compat: an old ?category=Name bookmark/link with no
      // matching tree node — same flat name-matching behaviour as before.
      visibleProducts = products.filter((p) => p.category === legacyCategoryName);
      activeLabel = legacyCategoryName;
      breadcrumbChain = [{ name: "Home", url: "/" }, { name: legacyCategoryName, url: "" }];
    } else {
      visibleProducts = products;
      activeLabel = "All";
      breadcrumbChain = [{ name: "Home", url: "/" }, { name: "Categories", url: "" }];
    }

    renderBreadcrumbNav(breadcrumbChain);
    setBreadcrumbJsonLd(breadcrumbChain.map((b) => ({ name: b.name, url: b.url ? `${window.location.origin}${b.url}` : window.location.href })));
    renderChildTiles(node);

    function updateSeoAndHeading(category, visibleCount) {
      Security.setTextSafely(titleEl, category === "All" ? "All Categories" : category);
      Security.setTextSafely(
        subtitleEl,
        category === "All"
          ? "Browse everything we carry."
          : `${visibleCount} product${visibleCount === 1 ? "" : "s"} in ${category}.`
      );

      // SEO: each category gets its own canonical URL, title and meta
      // description so Google can index it as a distinct page instead of
      // every URL collapsing onto one canonical.
      const pageTitle = category === "All" ? "Categories — AzubaTrends" : `${category} — AzubaTrends`;
      const pageDesc = category === "All"
        ? "Browse AzubaTrends's home goods by category — decor, lighting, kitchen, textiles, and storage."
        : `Shop ${category} at AzubaTrends — browse our full ${category.toLowerCase()} collection.`;
      const canonicalUrl = category === "All"
        ? `${window.location.origin}/category`
        : `${window.location.origin}/category/${node ? node.fullPath : encodeURIComponent(category)}`;

      document.getElementById("page-title").textContent = pageTitle;
      document.getElementById("page-description").setAttribute("content", pageDesc);
      document.getElementById("page-canonical").setAttribute("href", canonicalUrl);
      document.getElementById("og-title").setAttribute("content", pageTitle);
      document.getElementById("og-description").setAttribute("content", pageDesc);
      document.getElementById("og-url").setAttribute("content", canonicalUrl);
      document.getElementById("twitter-title").setAttribute("content", pageTitle);
      document.getElementById("twitter-description").setAttribute("content", pageDesc);
    }

    const listing = ProductListing.mount(
      document.getElementById("filter-bar-mount"),
      grid,
      visibleProducts,
      {
        initialCategory: "All",
        emptyMessage: "No products in this category yet — try another filter."
      }
    );
    updateSeoAndHeading(activeLabel, visibleProducts.length);
  });
</script>
</body>
