<!-- AZUBA-VIEWPORT-FIX: forces the real device width on OEM/old WebView
     browsers (Transsion/Tecno/Infinix stock browser, old MIUI browser,
     UC/QQ/360 browser, older Android System WebView) that ignore
     width=device-width and instead lay the page out on a wider phantom
     canvas, making everything except fixed elements render too small. -->
<script>
(function () {
  function realWidth() {
    return (window.visualViewport && window.visualViewport.width) || window.screen.width || window.innerWidth;
  }
  function layoutWidth() {
    return document.documentElement.clientWidth || window.innerWidth;
  }
  function fix() {
    try {
      var real = Math.round(realWidth());
      var layout = Math.round(layoutWidth());
      if (!real || !layout) return;
      if (Math.abs(layout - real) > 4) {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          document.head.insertBefore(meta, document.head.firstChild);
        }
        meta.setAttribute(
          'content',
          'width=' + real + ', initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
        );
        document.documentElement.style.width = real + 'px';
      }
    } catch (e) {}
  }
  fix();
  document.addEventListener('DOMContentLoaded', fix);
  window.addEventListener('load', fix);
  window.addEventListener('orientationchange', function () { setTimeout(fix, 150); });
  window.addEventListener('resize', fix);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fix);
  }
})();
</script>

<script>
  window.addEventListener("layout:ready", () => ProductLoader.initHeader());

  // Injects/updates the BreadcrumbList JSON-LD block for the current
  // breadcrumb chain (Home + every ancestor + the current category).
  function setBreadcrumbJsonLd(items) {
    let scriptEl = document.getElementById("breadcrumb-jsonld");
    if (!scriptEl) {
      scriptEl = document.createElement("script");
      scriptEl.type = "application/ld+json";
      scriptEl.id = "breadcrumb-jsonld";
      document.head.appendChild(scriptEl);
    }
    scriptEl.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      itemListElement: items.map((item, i) => ({
        "@type": "ListItem",
        position: i + 1,
        name: item.name,
        item: item.url
      }))
    });
  }

  function renderBreadcrumbNav(chainLinks) {
    const nav = document.getElementById("category-breadcrumb");
    nav.innerHTML = "";
    chainLinks.forEach((item, i) => {
      if (i > 0) nav.appendChild(document.createTextNode(" / "));
      if (item.url && i < chainLinks.length - 1) {
        const a = document.createElement("a");
        a.href = item.url;
        a.textContent = item.name;
        nav.appendChild(a);
      } else {
        const span = document.createElement("span");
        span.textContent = item.name;
        nav.appendChild(span);
      }
    });
  }

  function renderChildTiles(node) {
    const wrap = document.getElementById("category-child-tiles");
    wrap.innerHTML = "";
    if (!node || node.children.length === 0) { wrap.hidden = true; return; }
    wrap.hidden = false;
    node.children
      .slice()
      .sort((a, b) => (a.name || "").localeCompare(b.name || ""))
      .forEach((child) => {
        const a = document.createElement("a");
        a.className = "category-tile";
        a.href = `/category/${child.fullPath}`;
        a.innerHTML = `
          <img src="${child.image ? window.Security.escapeHTML(child.image) : "images/logo-placeholder.svg"}" alt="" loading="lazy">
          <span>${window.Security.escapeHTML(child.name || "")}</span>
        `;
        wrap.appendChild(a);
      });
  }

  document.addEventListener("DOMContentLoaded", async () => {

    const grid = document.getElementById("product-grid");
    ProductLoader.renderSkeletonGrid(grid, 8);

    const [products, categories] = await Promise.all([
      ProductLoader.loadAllProducts(),
      CategoryLoader.loadAllCategories()
    ]);
    const tree = CategoryLoader.buildTree(categories);
    const titleEl = document.getElementById("category-title");
    const subtitleEl = document.getElementById("category-subtitle");

    // Clean URL is /category/some/nested/path (see _redirects' /category/*
    // rewrite -> this file), same technique product.html and blog-post.html
    // use. Every segment after "category" joins back into the fullPath the
    // nested-category tree above uses to resolve a node.
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const fullPathFromUrl = pathParts[0] === "category" ? pathParts.slice(1).join("/") : "";
    const params = new URLSearchParams(window.location.search);
    const legacyCategoryName = params.get("category") || "";

    const node = fullPathFromUrl ? CategoryLoader.findByFullPath(tree, decodeURIComponent(fullPathFromUrl)) : null;

    let visibleProducts;
    let activeLabel;
    let breadcrumbChain;

    if (node) {
      // Tree mode: this category + every descendant's products, plus any
      // legacy product that only has the flat `category` name matching
      // this exact node (no categoryId yet — pre-migration data).
      const idSet = new Set([node.id, ...CategoryLoader.getDescendantIds(node)]);
      visibleProducts = products.filter((p) => (p.categoryId && idSet.has(p.categoryId)) || (!p.categoryId && p.category === node.name));
      activeLabel = node.name;
      breadcrumbChain = [{ name: "Home", url: "/" }, ...CategoryLoader.breadcrumbChain(tree, node).map((n) => ({ name: n.name, url: `/category/${n.fullPath}` }))];
    } else if (legacyCategoryName && legacyCategoryName !== "All") {
      // Backward-compat: an old ?category=Name bookmark/link with no
      // matching tree node — same flat name-matching behaviour as before.
      visibleProducts = products.filter((p) => p.category === legacyCategoryName);
      activeLabel = legacyCategoryName;
      breadcrumbChain = [{ name: "Home", url: "/" }, { name: legacyCategoryName, url: "" }];
    } else {
      visibleProducts = products;
      activeLabel = "All";
      breadcrumbChain = [{ name: "Home", url: "/" }, { name: "Categories", url: "" }];
    }

    renderBreadcrumbNav(breadcrumbChain);
    setBreadcrumbJsonLd(breadcrumbChain.map((b) => ({ name: b.name, url: b.url ? `${window.location.origin}${b.url}` : window.location.href })));
    renderChildTiles(node);

    function updateSeoAndHeading(category, visibleCount) {
      Security.setTextSafely(titleEl, category === "All" ? "All Categories" : category);
      Security.setTextSafely(
        subtitleEl,
        category === "All"
          ? "Browse everything we carry."
          : `${visibleCount} product${visibleCount === 1 ? "" : "s"} in ${category}.`
      );

      // SEO: each category gets its own canonical URL, title and meta
      // description so Google can index it as a distinct page instead of
      // every URL collapsing onto one canonical.
      const pageTitle = category === "All" ? "Categories — AzubaTrends" : `${category} — AzubaTrends`;
      const pageDesc = category === "All"
        ? "Browse AzubaTrends's home goods by category — decor, lighting, kitchen, textiles, and storage."
        : `Shop ${category} at AzubaTrends — browse our full ${category.toLowerCase()} collection.`;
      const canonicalUrl = category === "All"
        ? `${window.location.origin}/category`
        : `${window.location.origin}/category/${node ? node.fullPath : encodeURIComponent(category)}`;

      document.getElementById("page-title").textContent = pageTitle;
      document.getElementById("page-description").setAttribute("content", pageDesc);
      document.getElementById("page-canonical").setAttribute("href", canonicalUrl);
      document.getElementById("og-title").setAttribute("content", pageTitle);
      document.getElementById("og-description").setAttribute("content", pageDesc);
      document.getElementById("og-url").setAttribute("content", canonicalUrl);
      document.getElementById("twitter-title").setAttribute("content", pageTitle);
      document.getElementById("twitter-description").setAttribute("content", pageDesc);
    }

    const listing = ProductListing.mount(
      document.getElementById("filter-bar-mount"),
      grid,
      visibleProducts,
      {
        initialCategory: "All",
        emptyMessage: "No products in this category yet — try another filter."
      }
    );
    updateSeoAndHeading(activeLabel, visibleProducts.length);
  });
</script>
