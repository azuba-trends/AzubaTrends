<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="width">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">
<meta name="format-detection" content="telephone=no">
<!-- AZUBA-VIEWPORT-FIX: forces the real device width on OEM/old WebView
     browsers (Transsion/Tecno/Infinix stock browser, old MIUI browser,
     UC/QQ/360 browser, older Android System WebView) that ignore
     width=device-width and instead lay the page out on a wider phantom
     canvas, making everything except fixed elements render too small. -->
<script>
(function () {
  function realWidth() {
    return (window.visualViewport && window.visualViewport.width) || window.screen.width || window.innerWidth;
  }
  function layoutWidth() {
    return document.documentElement.clientWidth || window.innerWidth;
  }
  function mismatched() {
    var real = Math.round(realWidth());
    var layout = Math.round(layoutWidth());
    return real && layout && Math.abs(layout - real) > 4;
  }
  function rewriteMeta() {
    var real = Math.round(realWidth());
    var meta = document.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = document.createElement('meta');
      meta.setAttribute('name', 'viewport');
      document.head.insertBefore(meta, document.head.firstChild);
    }
    meta.setAttribute(
      'content',
      'width=' + real + ', initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
    );
  }
  // Rewriting the <meta viewport> content alone is often not enough on
  // OEM/old WebView browsers (Tecno/Infinix/Transsion stock browser, old
  // MIUI browser, UC/QQ/360 browser): they commit a wrong layout
  // viewport at parse time and only ever recompute it in response to an
  // actual pinch/zoom gesture — a JS content change doesn't trigger that
  // recompute. A tiny CSS zoom toggle forces the same kind of recompute
  // these engines do on a real pinch, without needing real touch input.
  function nudge() {
    var html = document.documentElement;
    html.style.zoom = '99.9%';
    requestAnimationFrame(function () {
      html.style.zoom = '100%';
      requestAnimationFrame(function () {
        html.style.zoom = '';
      });
    });
    try { window.scrollTo(0, 1); window.scrollTo(0, 0); } catch (e) {}
    try { window.dispatchEvent(new Event('resize')); } catch (e) {}
  }
  var attempts = 0;
  function fix() {
    if (!mismatched()) return;
    rewriteMeta();
    nudge();
    attempts++;
    // Retry with backoff — on a very slow connection the page keeps
    // reflowing as images/content arrive, which can re-trigger the bug
    // after the first fix looked successful.
    if (attempts < 8) {
      setTimeout(function () { if (mismatched()) fix(); }, attempts * 250);
    }
  }
  fix();
  document.addEventListener('DOMContentLoaded', fix);
  window.addEventListener('load', fix);
  window.addEventListener('pageshow', fix);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) fix(); });
  window.addEventListener('orientationchange', function () { setTimeout(fix, 200); });
  window.addEventListener('resize', fix);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fix);
  }
})();
</script>

<body>

<div id="header-mount"></div>

<main>
  <div class="container">
    <section class="page-header">
      <div class="breadcrumb"><a href="/">Home</a> / Blog</div>
      <h1 id="blog-title">Blog</h1>
      <p id="blog-subtitle">Stories, guides and updates from AzubaTrends.</p>
    </section>

    <div class="chip-row" id="blog-category-chips" aria-label="Filter by category"></div>

    <div class="blog-grid" id="blog-grid" aria-live="polite"></div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="/js/site-config.js"></script>
<script src="/js/tracking.js"></script>
<script src="/js/security.js"></script>
<script src="/js/zoom-debug.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/loading-overlay.js"></script>
<script src="/js/a2hs.js"></script>
<script src="/js/cart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>
<script src="/js/product-loader.js"></script>
<script src="/js/search.js"></script>
<script src="/js/blog-loader.js"></script>
<script>
  window.addEventListener("layout:ready", () => ProductLoader.initHeader());

  document.addEventListener("DOMContentLoaded", async () => {
    const grid = document.getElementById("blog-grid");
    const chips = document.getElementById("blog-category-chips");
    const titleEl = document.getElementById("blog-title");
    const subtitleEl = document.getElementById("blog-subtitle");
    grid.innerHTML = '<p class="blog-empty">Loading posts…</p>';

    const [posts, categories] = await Promise.all([
      BlogLoader.loadPublishedPosts(),
      BlogLoader.loadBlogCategories()
    ]);

    // Clean URL is /blog/category/:slug (see vercel.json rewrite -> this
    // file), same technique category.html uses for products. Old
    // ?category= links still work as a fallback so nothing breaks.
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const pathSlug = (pathParts[0] === "blog" && pathParts[1] === "category") ? pathParts[2] : null;
    const params = new URLSearchParams(window.location.search);
    const slugParam = pathSlug || params.get("category");

    function findCategoryBySlug(slug) {
      return categories.find((c) => c.slug === slug) || null;
    }

    // Guard against a stale/typo'd slug in the URL — falls back to "All"
    // (represented as activeCategory === null) same as category.html does
    // for an unknown category value.
    let activeCategory = slugParam ? findCategoryBySlug(slugParam) : null;

    async function applyFilter() {
      const filtered = activeCategory ? await BlogLoader.getPostsByCategory(activeCategory.name) : posts;

      Security.setTextSafely(titleEl, activeCategory ? activeCategory.name : "Blog");
      Security.setTextSafely(
        subtitleEl,
        activeCategory
          ? (activeCategory.description || `${filtered.length} post${filtered.length === 1 ? "" : "s"} in ${activeCategory.name}.`)
          : "Stories, guides and updates from AzubaTrends — handmade home decor, textiles and more from West Bengal."
      );
      BlogLoader.renderGrid(grid, filtered, "No posts in this category yet — check back soon.");

      // SEO: each blog category gets its own canonical URL, title and meta
      // description so Google can index it as a distinct page instead of
      // every ?category= value collapsing onto one canonical.
      const pageTitle = activeCategory
        ? (activeCategory.seoTitle || `${activeCategory.name} — AzubaTrends Blog`)
        : "Blog — AzubaTrends";
      const pageDesc = activeCategory
        ? (activeCategory.seoDesc || activeCategory.description || `Read our latest posts about ${activeCategory.name.toLowerCase()} at AzubaTrends.`)
        : "Stories, guides and updates from AzubaTrends — handmade home decor, textiles and more from West Bengal.";
      const canonicalUrl = activeCategory
        ? `${window.location.origin}/blog/category/${encodeURIComponent(activeCategory.slug)}`
        : `${window.location.origin}/blog`;

      document.getElementById("page-title").textContent = pageTitle;
      document.getElementById("page-description").setAttribute("content", pageDesc);
      document.getElementById("page-canonical").setAttribute("href", canonicalUrl);
      document.getElementById("og-title").setAttribute("content", pageTitle);
      document.getElementById("og-description").setAttribute("content", pageDesc);
      document.getElementById("og-url").setAttribute("content", canonicalUrl);
      document.getElementById("twitter-title").setAttribute("content", pageTitle);
      document.getElementById("twitter-description").setAttribute("content", pageDesc);
    }

    function selectCategory(cat) {
      activeCategory = cat; // a blogCategories object, or null for "All"
      const path = cat ? `/blog/category/${encodeURIComponent(cat.slug)}` : "/blog";
      history.replaceState(null, "", path);
      renderChips();
      applyFilter();
    }

    function renderChips() {
      chips.innerHTML = "";
      const allChip = document.createElement("button");
      allChip.className = "chip" + (!activeCategory ? " is-active" : "");
      allChip.textContent = "All";
      allChip.addEventListener("click", () => selectCategory(null));
      chips.appendChild(allChip);

      categories.forEach((cat) => {
        const chip = document.createElement("button");
        chip.className = "chip" + (activeCategory && activeCategory.slug === cat.slug ? " is-active" : "");
        chip.textContent = cat.name;
        chip.addEventListener("click", () => selectCategory(cat));
        chips.appendChild(chip);
      });
    }

    renderChips();
    await applyFilter();
  });
</script>
</body>
</html>
